<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <style>
        /* .nav-bar a {
            width: 120px;
            height: 30px;
            border: 1px solid black;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            position: relative;
            left: 200px;

        } */

        #height,
        #weight {
            width: 150px;
            height: 23px;
            margin-top: 30px;
        }

        .container {
            width: 575px;
            height: 825px;
            background-color: gray;
            padding-left: 30px;

        }

        .calculate-button {
            margin-left: 130px;
            width: 110px;
            height: 32px;
            border: 1px solid black;
            border-radius: 6px;
            font-size: 19px;
        }

        .result {
            font-size: 35px;
            margin-left: 90px;
            margin-top: 20px;
            color: rgb(241, 241, 241);
        }

        h3 {
            margin-left: 100px;
        }

        .weight-guid {
            margin-left: 100px;
        }
    </style>
</head>

<body>
    <!-- <nav class="nav-bar">
        <a href="/" aria-current="page">Home</a>
        <a href="https://www.linkedin.com/in/vijesh-kumar-536a79329">linkedin</a>
    </nav> -->
    <div class="container">
        <h1>BMI Calculator</h1>

        <form>
            <p><label>Height in CM:</label><input type="text" id="height"></p>
            <p><label>Weight in KG:</label><input type="text" id="weight"></p>

            <button class="calculate-button">Calculate</button>
            <h3>BMI Weight Guide</h3>

            <div class="result"></div>

            <div class="weight-guid">
                <p>Under Weight = less then 18.6</p>
                <p>Normal Range = 18.6 and 24.9</p>
                <p>Overweight = Greater than 24.9</p>
            </div>
        </form>

    </div>
</body>

<script>
    const form = document.querySelector('form')

    form.addEventListener('submit', function (e) {
        e.preventDefault();


        const height = parseInt(document.querySelector('#height').value)
        const weight = parseInt(document.querySelector('#weight').value)
        const result = document.querySelector('.result');

        if (height === '' || height < 0 || isNaN(height)) {
            result.innerHTML = `please give valid height ${height}`;

        } else if (weight === '' || weight < 0 || isNaN(weight)) {
            result.innerHTML = `please give valid weight ${weight}`;

        }
        // apply formula
        const bmi = (weight / ((height * height) / 10000)).toFixed(2);

        // BMI Category
        if (bmi < 18.6) {
            result.innerHTML = `BMI: ${bmi}<br>Under Weight`;

        } else if (bmi >= 18.6 && bmi <= 24.9) {
            result.innerHTML = `BMI: ${bmi}<br>Normal Range`;

        } else {
            result.innerHTML = `BMI: ${bmi}<br>Over Weight`;

        }


    })
</script>

</html>
